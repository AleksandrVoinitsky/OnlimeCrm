services:
  web:
    build:
      context: .
    env_file:
      - .env
    command: uvicorn config.asgi:application --host 0.0.0.0 --port 8000
    ports:
      - "${WEB_PORT:-8000}:8000"
    volumes:
      - sqlite_data:/var/lib/onlime
      - media_data:/app/media
      - static_data:/app/staticfiles
    restart: unless-stopped
    init: true
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health/', timeout=3)",
        ]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s
    mem_limit: 512m
    cpus: 1.0

volumes:
  sqlite_data:
  media_data:
  static_data:
